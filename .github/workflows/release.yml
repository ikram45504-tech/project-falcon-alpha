name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App (Cloud Sync)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Travel Accounting App v__VERSION__"
          releaseBody: |
            ## Travel Hisab (Cloud Sync)
            Desktop app with local SQLite + Supabase sync when online. Auto-update enabled.

            ## Travel Hisab Offline
            Same booking features with **no cloud login, sync, or auto-update**. Data stays on this computer.
            Download the installer whose name includes **Offline**.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Build Tauri App (Offline Only)
        run: npm run tauri build -- --config src-tauri/tauri.offline.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload offline installers to release
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="app-v${VERSION}"
          mapfile -t assets < <(
            find src-tauri/target/release/bundle -type f \
              \( -iname '*offline*.exe' -o -iname '*offline*.msi' -o -iname '*offline*.dmg' -o -iname '*offline*.tar.gz' \) \
              2>/dev/null | sort -u
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No offline bundle files found under src-tauri/target/release/bundle"
            exit 1
          fi
          echo "Uploading offline assets:"
          printf '  - %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
